name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Pasang plugin SMS dan izin
        run: |
          cp native/SmsSenderPlugin.java native/MainActivity.java android/app/src/main/java/com/pengingat/license/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SEND_SMS" />\n    <uses-feature android:name="android.hardware.telephony" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: pengingat-license-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
